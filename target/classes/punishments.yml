#
# Список Action's:
#
# $close_inv$, $server_close_inv$, $stop_sprinting$, $stop_sneaking$, $stop_gliding$
# $stop_flying$, $disable_flight$, $update_inventory$, $player_update_inventory$, $server_update_inventory$
#
# Примеры названий чеков:
# !InventoryA, !Inventory^, Inventory^, InventoryA
#
# Inventory^ - Все чеки у которых начало Inventory
# !InventoryA - Не InventoryA (исключение)
# !Inventory^ - Исключаем все чеки у которых начало на Inventory
# InventoryA - Чистое название проверки
#
autofish:
  checks:
    - AutoFishA
  punishments:
    - "7;$flag$"
    - "2;$alert$"
actions:
  checks:
    - ActionsSpamA
  punishments:
    - "1;$alert$"
    - "3;$fdamage_0.1$"
    - "2;$flag$"
    - "5;lmvac ban %player%"
